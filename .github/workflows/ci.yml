# Pipeline d'integration continue : a chaque push / pull request, on verifie
# sur une machine propre que le backend compile et que le frontend se construit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilation et tests
        run: mvn -B verify

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dependances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build de production
        run: npm run build

  # Sans le secret SONAR_TOKEN (projet SonarQube Cloud pas encore configure), le job
  # passe sans rien analyser au lieu de faire echouer la CI ; il s'active seul une fois
  # le secret ajoute. Un "if" de job ne peut pas lire les secrets : on teste par etape.
  sonar:
    name: Analyse SonarQube Cloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Secret SONAR_TOKEN absent, analyse ignoree
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN n'est pas configure dans le repo, analyse SonarQube Cloud ignoree."

      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          # Historique complet : Sonar en a besoin pour attribuer les nouveaux problemes
          fetch-depth: 0

      - uses: actions/setup-java@v4
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Sonar analyse le bytecode Java et lit le rapport de couverture JaCoCo :
      # on compile et on lance les tests avant le scan
      - name: Compilation, tests et couverture du backend
        if: env.SONAR_TOKEN != ''
        run: mvn -B verify
        working-directory: backend

      - name: Scan SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6

      # Fait echouer la CI si le code ne respecte pas le Quality Gate SonarQube Cloud
      - name: Verification du Quality Gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
