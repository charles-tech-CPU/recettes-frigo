spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/recettes_frigo
    username: ${DB_USER:recettes_user}
    password: ${DB_PASSWORD:recettes_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8085

app:
  deepl:
    # Cle de l'API DeepL (gratuite : https://www.deepl.com/pro-api, suffixe ":fx").
    # Absente : les recettes TheMealDB restent en anglais.
    api-key: ${DEEPL_API_KEY:}
  cors:
    # Liste de motifs separes par des virgules (ex: http://*:8180,https://*:8280).
    # Absente ou vide : Vite en LAN et acces HTTPS via Tailscale (WebConfig.DEFAULT_ALLOWED_ORIGINS).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
