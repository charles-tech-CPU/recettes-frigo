spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/recettes_frigo
    username: ${DB_USER:recettes_user}
    password: ${DB_PASSWORD:recettes_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8085

app:
  translation:
    # Traduction gratuite MyMemory, sans compte ni cle. Optionnel : une adresse email
    # (aucune inscription) fait passer le quota de 5 000 a 50 000 caracteres par jour.
    email: ${MYMEMORY_EMAIL:}
  cors:
    # Liste de motifs separes par des virgules (ex: http://*:8180,https://*:8280).
    # Absente ou vide : Vite en LAN et acces HTTPS via Tailscale (WebConfig.DEFAULT_ALLOWED_ORIGINS).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
